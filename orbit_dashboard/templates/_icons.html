{# Inline SVG icon set (stroke-based, Epic-flavored line icons). #}
{%- macro icon(name, size=16, stroke='currentColor', sw=1.5) -%}
<svg class="glyph" width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none"
     stroke="{{ stroke }}" stroke-width="{{ sw }}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{%- if name == 'wrench' -%}
<path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18v3h3l6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.3-.2-.2-2.3z"/>
{%- elif name == 'gear' -%}
<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2 2 2 0 1 1-4 0 1.7 1.7 0 0 0-2.9-1.2l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.2-2.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 2.9 1.2l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0 1.2 2.9H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>
{%- elif name == 'chevron-down' -%}
<path d="m6 9 6 6 6-6"/>
{%- elif name == 'target' -%}
<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4"/>
{%- elif name == 'layers' -%}
<path d="m12 3 9 5-9 5-9-5 9-5z"/><path d="m3 13 9 5 9-5"/>
{%- elif name == 'image' -%}
<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10" r="1.5"/><path d="m21 16-5-5-8 8"/>
{%- elif name == 'ai' -%}
<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 12h8M8 8h8M8 16h5"/>
{%- elif name == 'flag' -%}
<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
{%- elif name == 'edit' -%}
<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>
{%- elif name == 'check' -%}
<path d="M20 6 9 17l-5-5"/>
{%- elif name == 'x' -%}
<path d="M18 6 6 18M6 6l12 12"/>
{%- elif name == 'info' -%}
<circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/>
{%- elif name == 'grid' -%}
<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
{%- elif name == 'sliders' -%}
<path d="M4 6h16M4 12h16M4 18h16"/><circle cx="9" cy="6" r="2" fill="currentColor" stroke="none"/><circle cx="15" cy="12" r="2" fill="currentColor" stroke="none"/><circle cx="8" cy="18" r="2" fill="currentColor" stroke="none"/>
{%- elif name == 'book' -%}
<path d="M4 4v16a2 2 0 0 1 2-2h14V2H6a2 2 0 0 0-2 2z"/><path d="M20 18H6"/>
{%- elif name == 'play' -%}
<path d="M6 4l14 8-14 8z" fill="currentColor" stroke="none"/>
{%- elif name == 'arrow-left' -%}
<path d="M19 12H5M12 19l-7-7 7-7"/>
{%- elif name == 'arrow-right' -%}
<path d="M5 12h14M12 5l7 7-7 7"/>
{%- elif name == 'xray' -%}
<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8" cy="9" r="1.6"/><path d="m21 17-5-5-9 8"/>
{%- elif name == 'dot-grid' -%}
<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>
{%- elif name == 'compass' -%}
<circle cx="12" cy="12" r="9"/><path d="m16 8-6 2-2 6 6-2 2-6z"/>
{%- else -%}
<circle cx="12" cy="12" r="9"/>
{%- endif -%}
</svg>
{%- endmacro -%}
